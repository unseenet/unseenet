name: release
# Push a tag like v0.2.1 to release, or v0.2.1a1 for an alpha (a test release:
# PyPI and GitHub mark it as a pre-release; pip only takes it with --pre).
# The tag must match unseenet.__version__.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); import unseenet; print(unseenet.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION" >&2; exit 1
          fi
          case "$VERSION" in
            *a*|*b*|*rc*) ;;   # alphas, betas, candidates: the notes are under [Unreleased]
            *) grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; } ;;
          esac
      - run: pip install -e ".[dev]" build twine
      - run: pytest -q
      - run: python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unseenet
    permissions:
      id-token: write          # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then   # an alpha: what is not released yet
            { echo "**Test release $VERSION.** Please try it and report what you find; for everyday use, take the newest full release."
              echo
              awk '/^## \[Unreleased\]/ {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md; } > notes.md
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in v0.*|*a*|*b*|*rc*) PRE="--prerelease";; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # the portable workflow got there first (as a draft): fill it in and publish
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Unseenet $GITHUB_REF_NAME" --notes-file notes.md $PRE --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Unseenet $GITHUB_REF_NAME" --notes-file notes.md $PRE
          fi
