name: portable
# Portable builds with Tor inside, for Linux, Windows and macOS, plus one
# all-in-one USB zip and the bootable image. Not on every merge (#544):
# - nightly: the "dev" pre-release (replaced each time, versioned like 0.2.1.dev3),
#   but only when main changed the software since the build "dev" was made from;
# - by hand: publish to "dev" (main only) or only as workflow artifacts, e.g. to
#   try a branch; "force" builds even when nothing changed;
# - version tags: attached to the release;
# - pull requests that change the build itself.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "dev = replace the dev pre-release (main only); artifact = workflow artifacts only"
        type: choice
        options: [dev, artifact]
        default: dev
      force:
        description: "Build even if nothing changed since the current dev build"
        type: boolean
        default: false
  pull_request:
    paths:
      - "tools/build_portable.py"
      - "tools/portable/**"
      - "tools/image/**"
      - "tools/tor-version.txt"
      - "src/unseenet/launcher.py"
      - "src/unseenet/portable.py"
      - "src/unseenet/core/tor.py"
      - ".github/workflows/portable.yml"

permissions:
  contents: read

concurrency:                     # a newer run on main replaces a running dev build
  group: portable-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  gate:
    # Nightly and by hand: is there anything new since the build "dev" was made
    # from? Tags and pull requests always build. Everything below waits for this.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$EVENT" != schedule ] && [ "$EVENT" != workflow_dispatch ] || [ "$FORCE" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0   # a branch: always build, as artifacts
          fi
          DEV=$(git ls-remote origin refs/tags/dev | cut -f1)
          if [ -z "$DEV" ] || ! git cat-file -e "$DEV^{commit}" 2>/dev/null; then
            echo "No dev build to compare with: building."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$DEV" HEAD -- src tools pyproject.toml .github/workflows/portable.yml; then
            echo "Nothing changed in the software since the dev build ($DEV): skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  tor:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    # Download the Tor Expert Bundles and check their OpenPGP signatures here,
    # where gpg is; the builds below get them with a SHA-256 to check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >
          python tools/build_portable.py --out tor
          --fetch-tor linux-x86_64 windows-x86_64 macos-aarch64 macos-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: tor-bundles
          path: tor/

  build:
    needs: tor
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, runner: ubuntu-22.04}     # older glibc: runs on more distros
          - {platform: windows-x86_64, runner: windows-latest}
          - {platform: macos-aarch64, runner: macos-latest}
          - {platform: macos-x86_64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                   # tags, for the development version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Development version (not on release tags)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: python tools/dev_version.py --write
      - name: Key ripening on Intel Macs (chiavdf has no wheel there)
        if: matrix.platform == 'macos-x86_64'
        shell: bash
        # built from source as in the Alpine image: only the Python module, no VDF client;
        # the self-test below proves it works in the build (UN-RFC 0025)
        run: |
          brew install gmp cmake
          BUILD_VDF_CLIENT=N pip install --no-binary chiavdf "chiavdf>=1.1"
      - run: pip install ".[tui]" pyinstaller pillow
      - uses: actions/download-artifact@v4
        with:
          name: tor-bundles
          path: tor
      - name: Build
        shell: bash
        run: >
          python tools/build_portable.py --platform ${{ matrix.platform }} --out dist
          --tor-archive tor/tor-expert-bundle-${{ matrix.platform }}-$(cat tools/tor-version.txt).tar.gz
      - name: Unpack as a user would
        shell: bash
        run: |
          mkdir try && cd try && python -c "import sys; sys.path.insert(0, '../tools'); import build_portable as b; from pathlib import Path; b.extract_zip(next(Path('../dist').glob('*.zip')), Path('.'))"
      - name: Self-test, offline (programs start, Tor runs)
        shell: bash
        working-directory: try/Unseenet
        run: ./${{ matrix.platform }}/unseenet --self-test --offline
      - name: Self-test over the Tor network
        continue-on-error: true            # the runner's network may not reach Tor
        timeout-minutes: 5
        shell: bash
        working-directory: try/Unseenet
        # the project's test node: proves the whole path, Tor to node, from this build
        run: >
          ./${{ matrix.platform }}/unseenet --self-test
          --node f6vnchi5p7ll4yn6yot6cz4ohzuxy3uhc3kztafuwn3zlyoup6tn64qd.onion
      - uses: actions/upload-artifact@v4
        with:
          name: unseenet-${{ matrix.platform }}
          path: dist/*.zip
          compression-level: 0

  usb:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write                      # for the draft release on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Development version (not on release tags)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: python tools/dev_version.py --write
      - uses: actions/download-artifact@v4
        with:
          pattern: unseenet-*
          path: zips
          merge-multiple: true
      - run: python tools/build_portable.py --combine zips/*.zip --out zips
      - run: python tools/build_portable.py --checksums zips/*.zip --out zips
      - uses: actions/upload-artifact@v4
        with:
          name: unseenet-usb-and-checksums
          path: |
            zips/*-usb.zip
            zips/SHA256SUMS.txt
          compression-level: 0
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The "release" workflow creates the release (after tests and PyPI);
          # wait for it and attach the zips. If it never comes, leave a draft.
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" zips/*.zip zips/SHA256SUMS.txt --clobber
              exit 0
            fi
            sleep 30
          done
          gh release create "$GITHUB_REF_NAME" zips/*.zip zips/SHA256SUMS.txt --draft \
            --title "Unseenet $GITHUB_REF_NAME" \
            --notes "Portable builds with Tor inside. See https://unseenet.org/portable/"

  image:
    # The bootable image (tools/image): Alpine from RAM, the boot menu, and the
    # portable builds on the same FAT partition. Booted in QEMU, BIOS and UEFI,
    # and its self-test must pass, Tor connecting included.
    needs: usb
    runs-on: ubuntu-latest
    timeout-minutes: 45                    # two boot tests of at most 15 minutes, and the build
    permissions:
      contents: write                      # attach to the release on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: unseenet-usb-and-checksums
          path: usb
      - name: Build
        run: |
          VERSION=$(python3 tools/dev_version.py)
          case "$GITHUB_REF" in refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}";; esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION=$VERSION sh tools/image/build.sh usb/*-usb.zip
      - name: Boot it in QEMU (BIOS and UEFI) and run its self-test
        run: |
          SU=sudo
          $SU apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          $SU apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq qemu-system-x86 ovmf mtools socat >/dev/null
          $SU chmod a+rw /dev/kvm 2>/dev/null || true
          $SU chown -R "$(id -u)" dist
          IMG=dist/image/unseenet-$VERSION-x86_64.img
          TIMEOUT=900 sh tools/image/boot-test.sh "$IMG" bios
          TIMEOUT=900 sh tools/image/boot-test.sh "$IMG" uefi
      - uses: actions/upload-artifact@v4
        with:
          name: unseenet-image
          path: |
            dist/image/unseenet-*.img.xz
            dist/image/unseenet-*-update.zip
          compression-level: 0
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMG=dist/image/unseenet-$VERSION-x86_64.img.xz
          UPD=dist/image/unseenet-$VERSION-x86_64-update.zip
          for i in $(seq 1 40); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            sleep 30
          done
          mkdir -p sums
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt -D sums 2>/dev/null || true
          ( cd dist/image && sha256sum "$(basename "$IMG")" "$(basename "$UPD")" ) >> sums/SHA256SUMS.txt
          # stable releases are signed by the maintainer: tools/project/sign_release.py
          gh release upload "$GITHUB_REF_NAME" "$IMG" "$UPD" sums/SHA256SUMS.txt --clobber

  dev:
    # The newest build of main as the pre-release "dev": one release, replaced
    # by the next nightly build, so others can try a fix before it is released.
    needs: [usb, image]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == 'dev'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: unseenet-*
          path: zips
          merge-multiple: true
      - name: Release notes
        run: |
          VERSION=$(python3 tools/dev_version.py)
          TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "**Development build $VERSION** - the newest code on \`main\`, built and self-tested automatically each night when something changed. Not a release: it may have bugs that a release would not. For everyday use, take the newest [release](https://github.com/unseenet/unseenet/releases)."
            echo
            echo "Built from $GITHUB_SHA. Found a bug? [Report it](https://github.com/unseenet/unseenet/issues/new/choose) and give the version $VERSION."
            echo
            echo "### Not released yet (from CHANGELOG.md)"
            awk '/^## \[Unreleased\]/ {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md
            echo
            echo "### Commits since $TAG"
            git log --format='- %s (%h)' "$TAG..HEAD"
          } > notes.md
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q .
      - name: Sign the checksums with the release key (sticks on the dev channel check it)
        env:
          UNSEENET_RELEASE_KEY: ${{ secrets.UNSEENET_RELEASE_KEY }}
        run: |
          ( cd zips && sha256sum ./*.img.xz ./*-update.zip | sed 's# ./# #' >> SHA256SUMS.txt )
          python tools/sign_sums.py zips/SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          git push -q origin ":refs/tags/dev" 2>/dev/null || true
          gh release create dev zips/*.zip zips/*.img.xz zips/SHA256SUMS.txt zips/SHA256SUMS.txt.sig \
            --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Development build $VERSION" --notes-file notes.md
      - name: Tell clients through the network (unseenet.releases, #264)
        env:
          UNSEENET_ANNOUNCE_SEED: ${{ secrets.UNSEENET_ANNOUNCE_SEED }}
          UNSEENET_STATE_DIR: tools/ripening   # the key's public ripening chain (UN-RFC 0025)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq tor
          sudo systemctl stop tor || true      # the poster runs its own
          python tools/announce.py client-release dev zips/SHA256SUMS.txt zips/SHA256SUMS.txt.sig
