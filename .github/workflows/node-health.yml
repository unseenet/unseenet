name: node-health
# Every day, reach each known node (src/unseenet/nodes.json) over Tor, and
# check with canary posts that it is connected to the others and carries their
# groups (UN-RFC 0021). A node that fails for 3 days gets a note to its
# operator; after 10 days it is taken off the list and the new list is posted
# to unseenet.nodes. See tools/node_health.py and tools/canary.py.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nodes-json                     # shares the lane with node requests
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq tor && (sudo systemctl stop tor || true)
      - env:
          UNSEENET_ANNOUNCE_SEED: ${{ secrets.UNSEENET_ANNOUNCE_SEED }}   # signs the canaries
          UNSEENET_STATE_DIR: tools/ripening   # the key's public ripening chain (UN-RFC 0025)
        run: python tools/node_health.py --actions actions.json
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/unseenet/nodes.json tools/node-health.json
          git commit -m "Known nodes: daily health check"
          git pull --rebase --autostash -q origin main
          git push origin HEAD:main
      - name: Post the new list to unseenet.nodes
        if: hashFiles('actions.json') != ''
        env:
          UNSEENET_ANNOUNCE_SEED: ${{ secrets.UNSEENET_ANNOUNCE_SEED }}
          UNSEENET_STATE_DIR: tools/ripening   # the key's public ripening chain (UN-RFC 0025)
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('actions.json'))['announce'] else 1)"; then
            python tools/announce.py nodes
          fi
      - name: Tell the operators
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import json, subprocess, tempfile
          actions = json.load(open("actions.json"))
          for c in actions["comments"]:
              with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False) as f:
                  f.write(c["body"])
              subprocess.run(["gh", "issue", "comment", str(c["issue"]), "--body-file", f.name], check=False)
          for i in actions["issues"]:
              with tempfile.NamedTemporaryFile("w", suffix=".md", delete=False) as f:
                  f.write(i["body"])
              subprocess.run(["gh", "issue", "create", "--title", i["title"], "--body-file", f.name],
                             check=False)
          EOF
