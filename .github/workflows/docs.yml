name: docs
# The docs this repository keeps, checked strictly on pull requests (and
# by hand). unseenet.org itself is built and published by unseenet/unseenet-docs,
# which gathers these pages and the UN-RFCs (#547).
on:
  pull_request:
    paths: ["docs/**", "rfc/**", "mkdocs.yml", "tools/docs_check.sh",
            "src/unseenet/client/session/**", "src/unseenet/client/localapi/**",
            "src/unseenet/node/server/**", "src/unseenet/core/store/**"]
  workflow_dispatch:
permissions:
  contents: read
env:
  DISABLE_MKDOCS_2_WARNING: "true"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material "mkdocstrings[python]"
      - run: tools/docs_check.sh
