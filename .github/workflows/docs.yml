name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", "rfc/**", "mkdocs.yml", "tools/build_docs.sh", "site-extra/**", "tools/docs_hooks.py", "src/unseenet/core/about.py", ".github/workflows/docs.yml",
            # the developers' reference is generated from these docstrings
            "src/unseenet/client/session/**", "src/unseenet/client/localapi/**"]
  # After a release or a new development build, so the front page shows its version
  workflow_run:
    workflows: [release, portable]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0               # tags, for the version on the front page without network
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material "mkdocstrings[python]" ruff
      - run: tools/build_docs.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the front page asks for the newest releases
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
