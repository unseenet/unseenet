name: docker
# The node's container image, ghcr.io/unseenet/node (Dockerfile, docs/node/docker.md):
# tested on every change, published as :dev from main and as :<version> and
# :latest from release tags, for amd64 and arm64, with provenance, an SBOM and
# a cosign signature.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", "Dockerfile", "docker/**", "pyproject.toml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["Dockerfile", "docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/unseenet/node

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write                      # cosign keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION=$(python3 tools/dev_version.py --write) ;;   # into this build only
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for a test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: unseenet-node:test
      - name: Test
        run: |
          docker run --rm -v t:/data unseenet-node:test && exit 1 || test $? -eq 64   # no passphrase
          KEY=$(docker run --rm -v t:/data -e UNSEENET_NODE_PASSPHRASE=ci unseenet-node:test --show-key | tail -1)
          echo "node key: $KEY"; case "$KEY" in ed25519:*) ;; *) exit 1 ;; esac
          docker run -d --name n -v t:/data -e UNSEENET_NODE_PASSPHRASE=ci -e UNSEENET_NO_TOR=1 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add FOWNER --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges unseenet-node:test
          for i in $(seq 1 30); do
            docker exec n python3 -c "import asyncio; from unseenet.node.stats import fetch; \
              s = asyncio.run(fetch('/data/monitor.sock')); print(s['node']['name'], s['node']['version'])" && break
            sleep 2
          done
          docker exec n ps -o user,args | grep -q "^unseenet .*unseenet-node"    # not root
          docker exec n unseenet-monitor --version
          docker logs n
          docker rm -f n

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push (amd64, arm64)
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
