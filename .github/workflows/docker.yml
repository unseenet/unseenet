name: docker
# The servers' container images from one Dockerfile: ghcr.io/unseenet/node
# (docs/node/docker.md) and ghcr.io/unseenet/replica (docs/replica.md, "In Docker").
# Published as :<version> and :latest from release tags only - not on every merge -
# for amd64 and arm64, with provenance, an SBOM and a cosign signature. By hand
# from main it publishes :dev; a pull request that changes an image only builds
# and tests it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", "docker/**", "deploy/docker-compose*.yml", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [node, replica]
    env:
      IMAGE: ghcr.io/unseenet/${{ matrix.target }}
    permissions:
      contents: read
      packages: write
      id-token: write                      # cosign keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *) VERSION=$(python3 tools/dev_version.py --write) ;;   # into this build only
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for a test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: unseenet-${{ matrix.target }}:test
      - name: Test the node
        if: matrix.target == 'node'
        run: |
          docker run --rm -v t:/data unseenet-node:test && exit 1 || test $? -eq 64   # no passphrase
          KEY=$(docker run --rm -v t:/data -e UNSEENET_NODE_PASSPHRASE=ci unseenet-node:test --show-key | tail -1)
          echo "node key: $KEY"; case "$KEY" in ed25519:*) ;; *) exit 1 ;; esac
          docker run -d --name unseenet-test -v t:/data -e UNSEENET_NODE_PASSPHRASE=ci -e UNSEENET_NO_TOR=1 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add FOWNER --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges unseenet-node:test
          for i in $(seq 1 30); do
            docker exec unseenet-test python3 -c "import asyncio; from unseenet.node.stats import fetch; \
              s = asyncio.run(fetch('/data/monitor.sock')); print(s['node']['name'], s['node']['version'])" && break
            sleep 2
          done
          docker exec unseenet-test ps -o user,args | grep -q "^unseenet .*unseenet-node"    # not root
          docker exec unseenet-test unseenet-monitor --version
          docker logs unseenet-test
          docker rm -f unseenet-test
      - name: Test the replica
        if: matrix.target == 'replica'
        run: |
          docker run --rm -v r:/data unseenet-replica:test && exit 1 || test $? -eq 64   # no passphrase
          docker run -d --name replica-test -v r:/data -e UNSEENET_REPLICA_PASSPHRASE=ci-passphrase-1 \
            -e UNSEENET_REPLICA_NODES=127.0.0.1:9 --read-only --tmpfs /tmp --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add FOWNER --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges unseenet-replica:test
          for i in $(seq 1 30); do docker logs replica-test 2>&1 | grep -q "ed25519:" && break; sleep 2; done
          docker logs replica-test
          docker exec replica-test ps -o user,args | grep -q "^unseenet .*unseenet-replica run"   # not root
          docker exec replica-test unseenet-replica status
          docker exec replica-test sh -c 'test ! -e /data/passphrase'      # the secret stays out of the volume
          docker exec replica-test unseenet-replica hold removal
          docker exec replica-test stat -c %U /data/config.json | grep -qx unseenet
          docker rm -f replica-test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push (amd64, arm64)
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
