name: tests
# On main and on pull requests - not on every pushed branch as well, which ran the matrix
# twice for every pull request - and not for changes to the docs or the RFCs only (#392).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rfc/**"
      - "site-extra/**"
      - "mkdocs.yml"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "rfc/**"
      - "site-extra/**"
      - "mkdocs.yml"
      - "**/*.md"
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # the portable builds run on these, so the tests must too
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
