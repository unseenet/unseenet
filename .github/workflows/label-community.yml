# Marks issues and pull requests opened by people outside the project
# with the "community" label, so they can be found in a Project view
# (filter: label:community is:open).
#
# pull_request_target is used so PRs from forks can be labelled too.
# This workflow never checks out or runs code from the pull request,
# which is what keeps pull_request_target safe here.

name: Label community contributions

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add "community" label to outside contributions
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'community';
            const INSIDERS = ['OWNER', 'MEMBER', 'COLLABORATOR'];

            const item = context.payload.issue || context.payload.pull_request;
            const author = item.user;

            if (author.type === 'Bot') {
              core.info(`Skipping bot ${author.login}`);
              return;
            }
            if (INSIDERS.includes(item.author_association)) {
              core.info(`Skipping ${author.login} (${item.author_association})`);
              return;
            }

            const { owner, repo } = context.repo;

            // Create the label the first time it is needed.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({
                owner, repo,
                name: LABEL,
                color: '0e8a16',
                description: 'Opened by someone outside the core team',
              });
            }

            await github.rest.issues.addLabels({
              owner, repo,
              issue_number: item.number,
              labels: [LABEL],
            });
            core.info(`Labelled #${item.number} from ${author.login} (${item.author_association})`);
