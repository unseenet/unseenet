# An Unseenet node with Docker Compose. See https://unseenet.org/node/docker/
#
#   echo 'a long passphrase' > unseenet_node_passphrase.txt && chmod 600 unseenet_node_passphrase.txt
#   docker compose up -d
#   docker compose logs node          # the onion address and node key, for your peers
#   docker compose exec node unseenet-monitor
services:
  node:
    image: ghcr.io/unseenet/node:latest
    container_name: unseenet-node
    restart: unless-stopped
    environment:
      UNSEENET_NODE_NAME: my-unseenet-node      # only used for the first node.toml
    secrets:
      - unseenet_node_passphrase
    volumes:
      - unseenet:/data                          # keys (sealed), articles, Tor, node.toml
    # No ports: the node is reached over Tor only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]   # only to hand /data to the node's user
    security_opt:
      - no-new-privileges:true

secrets:
  unseenet_node_passphrase:
    file: ./unseenet_node_passphrase.txt

volumes:
  unseenet:
