set timeout=3
set default=0

menuentry "Unseenet @VERSION@" {
    linux /boot/vmlinuz-lts @CMDLINE@
    initrd /boot/initramfs-lts
}

menuentry "Unseenet - safe graphics (if the screen stays black)" {
    linux /boot/vmlinuz-lts @CMDLINE@ nomodeset
    initrd /boot/initramfs-lts
}

menuentry "Self-test (prints to the serial port, then shuts down)" {
    linux /boot/vmlinuz-lts @CMDLINE@ console=tty1 console=ttyS0,115200 unseenet.selftest
    initrd /boot/initramfs-lts
}
