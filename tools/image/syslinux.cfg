UI menu.c32
PROMPT 0
TIMEOUT 30
MENU TITLE Unseenet @VERSION@
DEFAULT unseenet

LABEL unseenet
  MENU LABEL Unseenet
  LINUX /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND @CMDLINE@

LABEL safe
  MENU LABEL Unseenet - safe graphics (if the screen stays black)
  LINUX /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND @CMDLINE@ nomodeset

LABEL selftest
  MENU LABEL Self-test (prints to the serial port, then shuts down)
  LINUX /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND @CMDLINE@ console=tty1 console=ttyS0,115200 unseenet.selftest
