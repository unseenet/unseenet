[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unseenet"
dynamic = ["version"]
description = "A Usenet-style, decentralized and encrypted discussion network over Tor onion services"
readme = "README.md"
keywords = ["usenet", "nntp", "tor", "onion", "decentralized", "encryption", "bbs", "privacy"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andreas Lorensen" }]
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5",
    "python-socks[asyncio]>=2.4",
    "certifi",                      # HTTPS for updates where the system has no certificates
    "markdown-it-py>=3",            # Markdown (UN-RFC 0031); pure Python, Textual uses it too
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Usenet News",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
tui = ["textual>=0.80"]
monitor = ["textual>=0.80"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual>=0.80"]

[project.scripts]
unseenet = "unseenet.cli:client_main"
unseenet-node = "unseenet.cli:node_main"
unseenet-tui = "unseenet.client.tui:main"
unseenet-monitor = "unseenet.monitor:main"
unseenet-registrar = "unseenet.registrar:main"

[project.urls]
Homepage = "https://github.com/unseenet/unseenet"
Documentation = "https://unseenet.org/"
Changelog = "https://github.com/unseenet/unseenet/blob/main/CHANGELOG.md"
Specification = "https://github.com/unseenet/unseenet/tree/main/rfc"

[tool.setuptools.dynamic]
version = { attr = "unseenet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unseenet = ["nodes.json", "hierarchies.json", "checkgroups.json", "emoji.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
