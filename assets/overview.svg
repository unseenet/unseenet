<svg width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="The whole network: clients reach nodes over Tor; a web entrance lets a browser in, a gateway links other networks." xmlns="http://www.w3.org/2000/svg"><style>
:root{--fg:#1f2328;--mut:#59636e;--bg:#ffffff;--pri:#009485;--acc:#00a86b;--acct:rgba(0,168,107,.07)}
@media (prefers-color-scheme: dark){:root{--fg:#e6edf3;--mut:#9198a1;--bg:#0d1117;--pri:#2ec4b6;--acc:#3fd18b;--acct:rgba(63,209,139,.08)}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.ug-torarea rect{fill:var(--acct);stroke:var(--acc);stroke-width:1.5;stroke-dasharray:6 5}
.ug-torarea text{fill:var(--acc);font-size:15px;font-weight:700}
.ug-torarea text.ug-note{font-weight:400}
.ug-box rect{fill:var(--bg);stroke:var(--pri);stroke-width:1.5}
.ug-title{fill:var(--fg);font-size:14px;font-weight:700;text-anchor:middle}
.ug-sub{fill:var(--mut);font-size:11px;text-anchor:middle}
.ug-link line{stroke:var(--pri);stroke-width:2}
.ug-note{fill:var(--mut);font-size:11px}
</style><g class="ug-torarea"><rect x="300" y="16" width="330" height="368" rx="26"/><text x="318" y="40">Tor</text><text class="ug-note" x="318" y="372">nodes have no address outside Tor</text></g><g class="ug-link"><line x1="190" y1="78" x2="400" y2="76"/><text class="ug-note" x="245" y="70" text-anchor="middle">over Tor</text></g><g class="ug-link"><line x1="190" y1="290" x2="236" y2="290"/></g><g class="ug-link"><line x1="360" y1="290" x2="400" y2="288"/></g><g class="ug-link"><line x1="520" y1="92" x2="540" y2="156"/></g><g class="ug-link"><line x1="540" y1="208" x2="520" y2="272"/></g><g class="ug-link"><line x1="460" y1="102" x2="460" y2="262"/><text class="ug-note" x="452" y="186" text-anchor="end">peering</text></g><g class="ug-link"><line x1="590" y1="208" x2="620" y2="290"/></g><g class="ug-link"><line x1="696" y1="316" x2="724" y2="316"/></g><g class="ug-box"><rect x="20" y="50" width="170" height="56" rx="8"/><text class="ug-title" x="105" y="73">Client</text><text class="ug-sub" x="105" y="91">portable · bootable</text></g><g class="ug-box"><rect x="20" y="262" width="170" height="56" rx="8"/><text class="ug-title" x="105" y="285">Browser</text><text class="ug-sub" x="105" y="303">phone · tablet · PC</text></g><g class="ug-box"><rect x="236" y="262" width="124" height="56" rx="8"/><text class="ug-title" x="298" y="285">Web entrance</text><text class="ug-sub" x="298" y="303">on the open web</text></g><g class="ug-box"><rect x="400" y="50" width="120" height="52" rx="8"/><text class="ug-title" x="460" y="73">Node</text><text class="ug-sub" x="460" y="91">onion service</text></g><g class="ug-box"><rect x="490" y="156" width="120" height="52" rx="8"/><text class="ug-title" x="550" y="179">Node</text><text class="ug-sub" x="550" y="197">onion service</text></g><g class="ug-box"><rect x="400" y="262" width="120" height="52" rx="8"/><text class="ug-title" x="460" y="285">Node</text><text class="ug-sub" x="460" y="303">onion service</text></g><g class="ug-box"><rect x="580" y="290" width="116" height="52" rx="8"/><text class="ug-title" x="638" y="313">Gateway</text><text class="ug-sub" x="638" y="331">between networks</text></g><g class="ug-box"><rect x="724" y="290" width="140" height="52" rx="8"/><text class="ug-title" x="794" y="313">Other networks</text><text class="ug-sub" x="794" y="331">Usenet · Matrix · Nostr</text></g></svg>
