site_name: Unseenet
site_description: Usenet, unseen - a decentralized, encrypted discussion network over Tor onion services
site_url: https://unseenet.org/
repo_url: https://github.com/unseenet/unseenet
repo_name: unseenet/unseenet
edit_uri: edit/main/docs/
copyright: Code Apache-2.0 · Specification and logo CC BY 4.0

theme:
  name: material
  logo: img/icon.svg
  favicon: img/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light mode
  # No Google Fonts: a privacy project should not make readers' browsers call Google.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

hooks:
  - tools/docs_hooks.py

plugins:
  - search
  # The developers' reference is generated from the docstrings (docs/developers/),
  # read from the source without importing it.
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            members_order: source
            filters: ["!^_"]
            show_source: false
            show_bases: false
            show_signature_annotations: true
            separate_signature: true
            docstring_section_style: list
            merge_init_into_class: true

exclude_docs: |
  assets/asciinema/README.md

extra_css:
  - assets/asciinema/asciinema-player.css
  - stylesheets/home.css

extra_javascript:
  - assets/asciinema/asciinema-player.min.js
  - javascripts/demo.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

