site_name: Unseenet
site_description: Usenet, unseen - a decentralized, encrypted discussion network over Tor onion services
site_url: https://unseenet.org/
repo_url: https://github.com/unseenet/unseenet
repo_name: unseenet/unseenet
edit_uri: edit/main/docs/
copyright: Code Apache-2.0 · Specification and logo CC BY 4.0

theme:
  name: material
  logo: img/icon.svg
  favicon: img/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light mode
  # No Google Fonts: a privacy project should not make readers' browsers call Google.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

plugins:
  - search
  # The developers' reference is generated from the docstrings (docs/developers/),
  # read from the source without importing it.
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            members_order: source
            filters: ["!^_"]
            show_source: false
            show_bases: false
            show_signature_annotations: true
            separate_signature: true
            docstring_section_style: list
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  # Only the pages kept in this repository: unseenet-docs gathers them into
  # unseenet.org with the rest (its sources.yml), at the same addresses.
  # This config is for previewing and for the strict check in pull requests
  # (tools/docs_check.sh); links to pages elsewhere are full unseenet.org addresses.
  - Getting started:
      - Graphical client:
          - Portable and bootable: graphical.md
          - In your browser (phones, tablets too): web.md
      - Terminal client:
          - Portable (Linux, macOS, Windows): portable.md
          - Bootable (USB, SSD etc.): bootable.md
          - Using the terminal client: client.md
      - Updating: updating.md
  - More ways to use it:
      - Gateways to other networks: gateways.md
      - Bots: bots.md
  - Running a node:
      - Installation: node/install.md
      - Configuration: node/configuration.md
      - Peering: node/peering.md
      - Operations: node/operations.md
      - Monitor: node/monitor.md
      - Docker: node/docker.md
      - Your responsibility: node/responsibility.md
  - Running an entrance:
      - What it is, and installation: entrance/index.md
      - Settings: entrance/settings.md
      - Certificates: entrance/certificates.md
      - New versions, the mirror and blocking: entrance/updates.md
      - Being listed: entrance/listed.md
      - Your responsibility: entrance/responsibility.md
  - Specification: spec/index.md
  - Developers:
      - Write a client: developers/index.md
      - The code: developers/code.md
      - Session reference: developers/session.md
      - Local client API: developers/localapi.md
      - Node reference: developers/node.md
      - Decisions and principles: development.md
