site_name: Unseenet
site_description: Usenet, unseen - a decentralized, encrypted discussion network over Tor onion services
site_url: https://unseenet.org/
repo_url: https://github.com/unseenet/unseenet
repo_name: unseenet/unseenet
edit_uri: edit/main/docs/
copyright: Code Apache-2.0 · Specification and logo CC BY 4.0

theme:
  name: material
  logo: img/icon.svg
  favicon: img/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light mode
  # No Google Fonts: a privacy project should not make readers' browsers call Google.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

exclude_docs: |
  assets/asciinema/README.md

extra_css:
  - assets/asciinema/asciinema-player.css
  - stylesheets/home.css

extra_javascript:
  - assets/asciinema/asciinema-player.min.js
  - javascripts/demo.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Portable (USB, Windows, macOS): portable.md
      - Bootable stick: bootable.md
      - Using the client: client.md
      - Other newsreaders: other-clients.md
      - Concepts: concepts.md
      - Tor and Tails: tor.md
  - Running a node:
      - Installation: node/install.md
      - Configuration: node/configuration.md
      - Peering: node/peering.md
      - Operations: node/operations.md
      - Monitor: node/monitor.md
      - Docker: node/docker.md
      - Your responsibility: node/responsibility.md
  - Specification:
      - The UN-RFC series: spec/index.md
      - "0000 Process": spec/un-rfc-0000.md
      - "0001 Architecture": spec/un-rfc-0001.md
      - "0002 Article format": spec/un-rfc-0002.md
      - "0003 Identities and crypto": spec/un-rfc-0003.md
      - "0004 Groups": spec/un-rfc-0004.md
      - "0005 ONNTP transport": spec/un-rfc-0005.md
      - "0006 Proof-of-work postage": spec/un-rfc-0006.md
      - "0007 Data at rest": spec/un-rfc-0007.md
      - "0008 Chat and low latency": spec/un-rfc-0008.md
      - "0009 Inbox and local groups": spec/un-rfc-0009.md
      - "0010 Known nodes": spec/un-rfc-0010.md
      - "0011 Node information": spec/un-rfc-0011.md
      - "0012 Retention and archives": spec/un-rfc-0012.md
      - "0013 Removing groups": spec/un-rfc-0013.md
      - "0014 Group rules": spec/un-rfc-0014.md
      - "0015 Ownership transfer": spec/un-rfc-0015.md
      - "0016 Peer keys": spec/un-rfc-0016.md
      - "0017 Catch-up by pull": spec/un-rfc-0017.md
      - "0018 Hierarchies": spec/un-rfc-0018.md
      - "0019 Names for identities": spec/un-rfc-0019.md
  - The project:
      - The project's keys: project/keys.md
      - Running a registrar replica: project/registrar.md
  - Development: development.md
